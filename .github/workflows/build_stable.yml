name: Build & Release Stable App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Stable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease

      - name: Sign APK with debug keystore
        run: |
          # Use Android build-tools apksigner to sign with the standard debug key so it installs seamlessly
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          mkdir -p release_apks
          RAW_APK=$(ls app/build/outputs/apk/stable/release/*.apk | head -n 1)
          
          # Find Android SDK apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:android --key-pass pass:android --out release_apks/CloudStream-stable.apk "$RAW_APK"
          else
            cp "$RAW_APK" release_apks/CloudStream-stable.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Stable-APK
          path: release_apks/CloudStream-stable.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: CloudStream Stable ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_apks/CloudStream-stable.apk
