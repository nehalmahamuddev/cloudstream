name: Build & Release Stable App

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.5-openstream)'
        required: false
        default: 'v1.0.5-openstream'
      changelog:
        description: 'Changelog / Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Stable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Version from toml
        id: app_version
        run: |
          VER=$(grep 'versionName =' gradle/libs.versions.toml | cut -d '"' -f 2)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved version from toml: $VER"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Stable Release APK
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_CLEAN=$(echo "$RAW_TAG" | sed -E 's/^v//' | sed -E 's/-.*//')
          if [ -n "$TAG_CLEAN" ] && [[ "$TAG_CLEAN" =~ [0-9] ]]; then
            echo "Building version $TAG_CLEAN from tag/input $RAW_TAG"
            ./gradlew assembleStableRelease -PappVersionName="$TAG_CLEAN"
          else
            echo "Building version ${{ steps.app_version.outputs.version }} from libs.versions.toml"
            ./gradlew assembleStableRelease -PappVersionName="${{ steps.app_version.outputs.version }}"
          fi

      - name: Sign APK with Openstream Release Keystore
        run: |
          mkdir -p release_apks
          RAW_APK=$(ls app/build/outputs/apk/stable/release/*.apk | head -n 1)
          
          # Find Android SDK apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          if [ -f "openstream-release.jks" ] && [ -n "$APKSIGNER" ]; then
            echo "Signing with openstream-release.jks..."
            $APKSIGNER sign \
              --ks openstream-release.jks \
              --ks-pass pass:openstream123 \
              --ks-key-alias openstream \
              --key-pass pass:openstream123 \
              --out release_apks/openstream.apk \
              "$RAW_APK"
          else
            echo "Fallback copying APK..."
            cp "$RAW_APK" release_apks/openstream.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openstream-Stable-APK
          path: release_apks/openstream.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}-openstream', steps.app_version.outputs.version) }}
          name: Openstream Stable ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}-openstream', steps.app_version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ${{ github.event.inputs.changelog || '✨ **What''s New in Openstream:**
            • Themed In-App update dialog matching active app colors
            • Official Openstream release key integrated
            • Automatic plugin updates enabled
            • Dynamic Range Compressor audio booster support
            • Performance & stability enhancements' }}
          files: |
            release_apks/openstream.apk
